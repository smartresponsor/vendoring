# ---------------------------------------------------------------------------
# Vendoring — /my/vendor/ self-service routes
# ---------------------------------------------------------------------------
# Authenticated vendor sees only their own data.
# No {id} in path — identity resolved from security context.
# ---------------------------------------------------------------------------

# My profile
vendor.my.profile.show:     { path: /my/vendor/profile/show,     service: App\Vendoring\Service\Vendor\Profile\VendorProfileHttpService }
vendor.my.profile.update:   { path: /my/vendor/profile/update,   service: App\Vendoring\Service\Vendor\Profile\VendorProfileHttpService }

# My transactions
vendor.my.transaction.index: { path: /my/vendor/transaction/index, service: App\Vendoring\Service\Vendor\Transaction\VendorTransactionHttpService }
vendor.my.transaction.create: { path: /my/vendor/transaction/create, service: App\Vendoring\Service\Vendor\Transaction\VendorTransactionHttpService }

# My statement
vendor.my.statement.show:    { path: /my/vendor/statement/show,   service: App\Vendoring\Service\Vendor\Statement\VendorStatementHttpService }

# My summary
vendor.my.summary.show:      { path: /my/vendor/summary/show,     service: App\Vendoring\Service\Vendor\Summary\VendorSummaryHttpService }

# My payout
vendor.my.payout.show:       { path: /my/vendor/payout/show,      service: App\Vendoring\Service\Vendor\Payout\VendorPayoutHttpService }
vendor.my.payout.calculate:  { path: /my/vendor/payout/calculate, service: App\Vendoring\Service\Vendor\Payout\VendorPayoutCalculateService }

# My runtime finance
vendor.my.runtime.finance.show: { path: /my/vendor/runtime/finance/show, service: App\Vendoring\Service\Vendor\Runtime\Finance\VendorRuntimeFinanceShowService }