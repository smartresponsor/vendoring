openapi: 3.1.0
info:
  title: "Vendoring API"
  version: 0.5.0-rc-docs
  description: "Release-candidate API surface for the Vendoring component. Generated from repository-owned metadata and DocBlock-aligned route contracts."
servers:
  -
    url: "/"
tags:
  -
    name: "Vendor Transactions"
    description: "Transaction write and read surfaces for vendors."
  -
    name: "Operator Surface"
    description: "Minimal server-rendered operator/admin seam used for RC evidence."
paths:
  /api/vendor/transaction:
    post:
      tags:
        - "Vendor Transactions"
      summary: "Create a vendor transaction"
      operationId: createVendorTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorTransactionCreateRequest"
      responses:
        201:
          description: "Transaction created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorTransactionCreateResponse"
        400:
          description: "Malformed JSON payload."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                malformed_json:
                  value:
                    error: malformed_json
        409:
          description: "Duplicate transaction."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: "Validation failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/vendor/transaction/{id}:
    get:
      tags:
        - "Vendor Transactions"
      summary: "List transactions by vendor"
      operationId: listVendorTransactionsByVendor
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Transaction collection."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorTransactionCollectionResponse"
  /api/vendor/transaction/status/{vendorId}/{id}:
    post:
      tags:
        - "Vendor Transactions"
      summary: "Update transaction status"
      operationId: updateVendorTransactionStatus
      parameters:
        -
          name: vendorId
          in: path
          required: true
          schema:
            type: string
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorTransactionStatusRequest"
      responses:
        200:
          description: "Transaction status updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorTransactionStatusResponse"
        400:
          description: "Malformed JSON payload."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: "Transaction not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: "Status validation failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/vendor/transaction/status/{id}:
    post:
      summary: "Update vendor transaction status by transaction id"
      operationId: updateVendorTransactionStatusById
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: "Transaction status updated."
  /api/vendor/ownership/{vendorId}:
    get:
      summary: "Read vendor ownership"
      operationId: getVendorOwnership
      parameters:
        -
          name: vendorId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Vendor ownership projection."
  /api/vendor/runtime/finance/{id}:
    get:
      summary: "Read vendor finance runtime state"
      operationId: getVendorRuntimeFinance
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Vendor finance runtime projection."
  /api/vendor/payout/statement/export/{vendorId}:
    get:
      summary: "Export vendor payout statement"
      operationId: exportVendorPayoutStatement
      parameters:
        -
          name: vendorId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Vendor payout statement export."
  /api/vendor/payout/statement/{id}:
    get:
      summary: "Read vendor payout statement"
      operationId: getVendorPayoutStatement
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Vendor payout statement."
  /api/vendor/payout/account:
    post:
      summary: "Create or update vendor payout account"
      operationId: upsertVendorPayoutAccount
      responses:
        200:
          description: "Vendor payout account updated."
  /api/vendor/payout:
    post:
      summary: "Create vendor payout"
      operationId: createVendorPayout
      responses:
        201:
          description: "Vendor payout created."
  /api/vendor/payout/process/{payoutId}:
    post:
      summary: "Process vendor payout"
      operationId: processVendorPayout
      parameters:
        -
          name: payoutId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Vendor payout processed."
  /api/vendor/payout/{payoutId}:
    get:
      summary: "Read vendor payout"
      operationId: getVendorPayout
      parameters:
        -
          name: payoutId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Vendor payout."
  /ops/vendor/transaction/{vendorId}:
    get:
      tags:
        - "Operator Surface"
      summary: "Render operator transaction page"
      operationId: renderVendorTransactionOperatorPage
      parameters:
        -
          name: vendorId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "HTML operator page."
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    VendorTransactionCreateRequest:
      type: object
      required:
        - vendorId
        - orderId
        - amount
      properties:
        vendorId:
          type: string
        orderId:
          type: string
        projectId:
          type:
            - string
            - null
        amount:
          type: string
          description: "Decimal amount represented as a string."
    VendorTransactionResource:
      type: object
      required:
        - id
        - vendorId
        - orderId
        - amount
        - status
      properties:
        id:
          type: integer
        vendorId:
          type: string
        orderId:
          type: string
        projectId:
          type:
            - string
            - null
        amount:
          type: string
        status:
          type: string
    VendorTransactionCreateResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
        status:
