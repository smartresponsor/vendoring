# Wave 16 reconciles service registration with the restored Vendoring persistence surface.

parameters:
  vendoring_secret: '%kernel.secret%'
  vendoring_feature_flags: { }
  vendoring_observability_dir: '%kernel.project_dir%/var/observability'
  vendoring_fault_tolerance_dir: '%kernel.project_dir%/var/fault-tolerance'
  vendoring_alert_thresholds:
    errorLogThreshold: 5
    openBreakerThreshold: 1
    missingProbeThreshold: 1
  vendoring_public_profile_path_template: '/vendor/{vendorId}'
  vendoring_rollback_thresholds:
    criticalAlertCodes: [ 'outbound_circuit_open' ]
    warningAlertCodes: [ 'runtime_error_spike', 'probe_artifacts_missing', 'observability_metrics_empty' ]

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Canonical reusable-bundle service export surface.
  # The host application should import this file rather than maintain a second parallel graph.
  App\Vendoring\:
    resource: '../../src/'
    exclude:
      - '../../src/DTO/'
      - '../../src/DataFixtures/'
      - '../../src/DependencyInjection/'
      - '../../src/Entity/'
      - '../../src/EntityInterface/'
      - '../../src/Event/'
      - '../../src/Kernel.php'
      - '../../src/RepositoryInterface/'
      - '../../src/ServiceInterface/'
      - '../../src/Support/'
      - '../../src/Service/'
      - '../../src/Service/Profile/Bridge/'
      - '../../src/Service/Attachment/Bridge/'
      - '../../src/Command/VendorPayoutCreateCommand.php'
      - '../../src/Command/VendorPayoutProcessCommand.php'
      - '../../src/ValueObject/'
      - '../../src/Form/'

      # Contract DTO is a value object — must not be registered as a service.
      - '../../src/Contract/'

      # Optional bridge coordinator is registered only when the host imports
      # config/component/optional/vendor_attaching_profile_bridge.yaml.
      - '../../src/Resolver/Profile/VendorChainedProfileAttachmentResolver.php'
      - '../../src/Resolver/Profile/Bridge/'



  # Canonical zero-controller HTTP surface services resolved by Cruding FQCN convention.
  App\Vendoring\Service\:
    resource: '../../src/Service/'
    exclude:
      - '../../src/Service/**/*Trait.php'
      - '../../src/Service/VendorApiErrorResponseTrait.php'
      - '../../src/Service/VendorBusinessOperationHttpTrait.php'
      - '../../src/Service/VendorHttpRequestTrait.php'
      - '../../src/Service/VendorStatementRequestHttpResolutionTrait.php'
      - '../../src/Service/Ownership/VendorOwnershipMutationService.php'
      - '../../src/Service/Attachment/Bridge/'
      - '../../src/Service/Profile/Bridge/'
  App\Vendoring\Service\VendorIndexService:
    public: true
  App\Vendoring\Service\VendorShowService:
    public: true
  App\Vendoring\Service\VendorNewService:
    public: true
  App\Vendoring\Service\VendorCreateService:
    public: true
  App\Vendoring\Service\VendorEditService:
    public: true
  App\Vendoring\Service\VendorUpdateService:
    public: true
  App\Vendoring\Service\VendorDeleteService:
    public: true

  # Route-facing zero-controller HTTP services must remain fetchable by FQCN.
  App\Vendoring\Service\Profile\VendorProfileHttpService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\Service\Statement\VendorStatementHttpService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\Service\Summary\VendorSummaryHttpService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\Service\Transaction\VendorTransactionHttpService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\Service\Transaction\Operator\VendorTransactionOperatorService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\Service\Ownership\VendorOwnershipHttpService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\Service\Runtime\Finance\VendorRuntimeFinanceShowService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\Service\Statement\Export\VendorStatementExportService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\Service\Payout\VendorPayoutHttpService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\Service\Payout\Account\VendorPayoutAccountService:
    public: true
    tags: ['controller.service_arguments']
  App\Vendoring\ServiceInterface\Crud\VendorCrudServiceInterface:
    alias: App\Vendoring\Service\Crud\VendorCrudService
  App\Vendoring\ServiceInterface\Attachment\VendorAttachmentOwnerPurgeServiceInterface: '@App\Vendoring\Service\Attachment\VendorAttachmentOwnerPurgeService'
  App\Vendoring\Form\:
    resource: '../../src/Form/'

  App\Vendoring\Repository\VendorPayoutAccountRepository:
    autowire: false
    arguments:
      $registry: '@doctrine'

  App\Vendoring\Repository\VendorPayoutRepository:
    autowire: false
    arguments:
      $registry: '@doctrine'




