# Optional host-level bridge. Import this file only in applications where Attaching is installed
# and exposes App\Attaching\ServiceInterface\Linking\Attachment\AttachmentPrimaryLinkServiceInterface.
services:
  App\Vendoring\Service\Attachment\Bridge\VendorAttachingOwnerPurgeService:
    arguments:
      $attachmentOwnerPurgeService: '@App\Attaching\ServiceInterface\Linking\Attachment\AttachmentOwnerPurgeServiceInterface'

  App\Vendoring\ServiceInterface\Attachment\VendorAttachmentOwnerPurgeServiceInterface: '@App\Vendoring\Service\Attachment\Bridge\VendorAttachingOwnerPurgeService'

  App\Vendoring\Resolver\Profile\Bridge\VendorAttachingProfileAttachmentResolver:
    arguments:
      $attachmentPrimaryLinkResolver: '@App\Attaching\ServiceInterface\Linking\Attachment\AttachmentPrimaryLinkServiceInterface'

  App\Vendoring\ResolverInterface\Profile\VendorProfileAttachmentResolverInterface: '@App\Vendoring\Resolver\Profile\Bridge\VendorAttachingProfileAttachmentResolver'
