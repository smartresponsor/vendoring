# Optional host-level bridge. Import this file only in applications where Attaching is installed
# and exposes App\Attaching\ServiceInterface\Attachment\AttachmentPrimaryLinkResolverServiceInterface.
services:
  App\Vendoring\Service\Attachment\Bridge\VendorAttachingOwnerPurgeService:
    arguments:
      $attachmentOwnerPurgeService: '@App\Attaching\ServiceInterface\Attachment\AttachmentOwnerPurgeServiceInterface'

  App\Vendoring\ServiceInterface\Attachment\VendorAttachmentOwnerPurgeServiceInterface: '@App\Vendoring\Service\Attachment\Bridge\VendorAttachingOwnerPurgeService'

  App\Vendoring\Service\Profile\Bridge\VendorAttachingProfileAttachmentResolverService:
    arguments:
      $attachmentPrimaryLinkResolver: '@App\Attaching\ServiceInterface\Attachment\AttachmentPrimaryLinkResolverServiceInterface'

  App\Vendoring\ServiceInterface\Profile\VendorProfileAttachmentResolverServiceInterface: '@App\Vendoring\Service\Profile\Bridge\VendorAttachingProfileAttachmentResolverService'
