name: Docs

on:
  push:
    branches: [master, main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Vendoring
    steps:
      - uses: actions/checkout@v4
        with:
          path: Vendoring
          persist-credentials: false

      - name: Bootstrap pinned Composer dependencies
        uses: ./Vendoring/.github/actions/bootstrap-dependencies
        with:
          gating-read-token: ${{ secrets.GATING_READ_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Docs quality
        run: composer quality:docs
