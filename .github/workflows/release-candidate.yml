name: Release Candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_pgsql, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Full RC validation
        run: composer quality:release-candidate

      - name: Upload RC evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence
          path: build/release/**

      - name: Generate RC evidence
        run: composer docs:rc-evidence