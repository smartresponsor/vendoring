name: Runtime

on:
  push:
    branches: [master, main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Vendoring
    steps:
      - uses: actions/checkout@v4
        with:
          path: Vendoring
          persist-credentials: false

      - name: Bootstrap pinned Composer dependencies
        uses: ./Vendoring/.github/actions/bootstrap-dependencies
        with:
          gating-read-token: ${{ secrets.GATING_READ_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_pgsql, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify locked dependencies
        run: composer audit --locked

      - name: Runtime tests
        run: composer quality:runtime

      - name: Isolated browser acceptance
        env:
          PANTHER_ISOLATED_ACCEPTANCE: '1'
          PANTHER_NO_SANDBOX: '1'
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          driver="$(command -v chromedriver)"
          chrome_version="$("$chrome" --version)"
          driver_version="$("$driver" --version)"
          [[ "$chrome_version" =~ ^Google\ Chrome\ ([0-9]+\.[0-9]+\.[0-9]+)\. ]]
          chrome_build="${BASH_REMATCH[1]}"
          [[ "$driver_version" =~ ^ChromeDriver\ ([0-9]+\.[0-9]+\.[0-9]+)\. ]]
          [[ "${BASH_REMATCH[1]}" == "$chrome_build" ]]
          export PANTHER_CHROME_BINARY="$chrome"
          export PANTHER_TEST_DRIVER_DIR="$(dirname "$driver")"
          php vendor/bin/phpunit --configuration phpunit.xml.dist --testsuite functional --fail-on-skipped --display-skipped

      - name: Persistence tests
        run: composer quality:persistence

      - name: API tests
        run: composer quality:api

      - name: Upload RC evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-runtime-evidence
          path: Vendoring/build/release/**
