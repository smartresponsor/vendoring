name: Runtime

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_pgsql, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Runtime tests
        run: composer quality:runtime

      - name: Persistence tests
        run: composer quality:persistence

      - name: API tests
        run: composer quality:api

      - name: Upload RC evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-runtime-evidence
          path: build/release/**